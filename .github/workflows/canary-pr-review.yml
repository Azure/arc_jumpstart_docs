name: Vale Linting and PR Review
on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master
    
    - name: Get all changed markdown files
      id: changed-markdown-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
           **.md
        json: true
        escape_json: false
        safe_output: false

    - name: List all changed files markdown files
      if: steps.changed-markdown-files.outputs.any_changed == 'true'
      env:
        CHANGED_FILES_JSON: ${{ steps.changed-markdown-files.outputs.all_changed_files }}
      run: |
        printf '%s' "$CHANGED_FILES_JSON" | jq -r '.[] | . + " was changed"'

    - name: Calculate changed files to pass to Vale
      id: calc_changed_files
      env:
        CHANGED_FILES_JSON: ${{ steps.changed-markdown-files.outputs.all_changed_files }}
      run: |
        files_to_change=$(printf '%s' "$CHANGED_FILES_JSON" | jq -c '.')
        printf 'files_to_change=%s\n' "$files_to_change"
        printf 'files_to_change=%s\n' "$files_to_change" >> "$GITHUB_ENV"
        
        if printf '%s' "$files_to_change" | jq -e 'length > 0' >/dev/null; then
          echo "run_vale=Yes" >> "$GITHUB_ENV"
        else
          echo "run_vale=No" >> "$GITHUB_ENV"
        fi

    - name: Vale
      if: ${{ env.run_vale != 'No' }}
      uses: errata-ai/vale-action@reviewdog
      with:
        version: 2.30.0
        reporter: github-pr-check
        filter_mode: nofilter
        fail_on_error: true
        files: '${{ env.files_to_change }}'
        token: ${{secrets.GITHUB_TOKEN}}