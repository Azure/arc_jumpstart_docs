name: Build Menu JSON

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/build-menu-json.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/build-menu-json.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure autogenerated folder exists
        run: |
          mkdir -p autogenerated
          echo "✅ autogenerated folder ready"

      - name: Install js-yaml
        run: |
          npm init -y >/dev/null 2>&1
          npm install js-yaml >/dev/null 2>&1
          echo "✅ js-yaml installed"

      - name: Build menu.json from docs
        run: |
          cat << 'EOF' > build-menu.js
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');

          function readYamlFrontMatter(filePath) {
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const match = content.match(/^---\s*[\r\n]+([\s\S]*?)[\r\n]+---/);
              return match ? yaml.load(match[1]) || {} : {};
            } catch {
              return {};
            }
          }

          function walk(dir, root) {
            return {
              name: path.basename(dir),
              type: 'directory',
              path: path.relative(root, dir).split(path.sep).join('/'),
              frontMatter: readYamlFrontMatter(path.join(dir, '_index.md')),
              children: fs.readdirSync(dir)
                .map(f => path.join(dir, f))
                .filter(p => fs.statSync(p).isDirectory())
                .map(p => walk(p, root))
            };
          }

          const rootDir = path.resolve(process.cwd(), 'jumpstart-docs/docs');

          if (!fs.existsSync(rootDir)) {
            console.error('❌ Docs path not found:', rootDir);
            process.exit(1);
          }

          const tree = walk(rootDir, rootDir);

          fs.mkdirSync('autogenerated', { recursive: true });
          fs.writeFileSync(
            'autogenerated/menu.json',
            JSON.stringify(tree, null, 2),
            'utf8'
          );

          console.log('✅ autogenerated/menu.json generated');
          EOF

          node build-menu.js

      - name: Validate generated JSON
        run: |
          node -e "
          const data = JSON.parse(require('fs').readFileSync('autogenerated/menu.json'));
          if (!data || data.type !== 'directory') {
            console.error('Invalid menu.json');
            process.exit(1);
          }
          console.log('✅ menu.json is valid');
          "
          
      - name: Display comprehensive file info
        run: |
          echo "File Statistics:"
          echo "==================="
          echo "Generated file: autogenerated/menu.json"
          echo "File size:"
          wc -c autogenerated/menu.json
          echo "Top-level children count:"
          node -e "
            const d = JSON.parse(require('fs').readFileSync('autogenerated/menu.json'));
            console.log(d.children?.length || 0);
          "

      - name: Check for changes and commit
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain autogenerated/menu.json)" ]; then
            echo "✅ Changes detected in autogenerated/menu.json"
            git add autogenerated/menu.json
            git commit -m "Auto-update menu.json from docs
          - Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push
            echo "✅ Changes committed and pushed"
          else
            echo "No changes detected in autogenerated/menu.json"
          fi

      - name: Summary
        run: |
          echo ""
          echo "Workflow Summary"
          echo "===================="
          echo "Source: docs/ folder"
          echo "Output: autogenerated/menu.json"
          echo "Trigger: ${{ github.event_name }}"
          echo "Menu nodes:"
          node -e "
            const d = JSON.parse(require('fs').readFileSync('autogenerated/menu.json'));
            console.log(d.children?.length || 0);
          "
